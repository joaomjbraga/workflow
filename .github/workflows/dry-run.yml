name: Dry-run bootstrap

on:
  push:
  pull_request:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare container
        run: |
          pacman -Syu --noconfirm bash git curl ca-certificates
      - name: Run install.sh (dry-run)
        run: |
          chmod +x ./install.sh
          ./install.sh --dry-run --yes
